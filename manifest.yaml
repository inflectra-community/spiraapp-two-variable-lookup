guid: "7c8f9a2b-4d6e-4f1a-9b3c-5e7d8f9a1b2d"
name: TwoVariableLookupTable
caption: Two-Variable Lookup Tables
summary: Configure and execute two-variable lookup tables for supporting CSA tailored risk decision logic
description: >-
  Computer Software Assurance (CSA) follows a tailed approach that does not use standard risk probability and impact.
  It uses semi-quantitative custom-defined qualitative categorization with a quantitative impact score.
  Unlike standard risk management, the exposure is a custom-defined look-up value for each combination (category, impact).
  It also associates a meaning with the look-up value that indicates the type of risk treatment needed.
  This SpiraApp ennables admins to create lookup tables that map two custom list values to output results with definitions.
  Configure the four properties and enter matrix values as JSON to automatically populate output fields on save.
productSummary: Configure and execute two-variable lookup tables for decision logic
productDescription: >-
  Adds automatic field population based on two-variable lookup tables. 
  Define List A, List B, output look up (integer) and definition (text) fields.
  Enter matrix values as JSON. The SpiraApp performs lookups and populates fields when you save.
author: Inflectra Corporation
url: https://inflectra.com
